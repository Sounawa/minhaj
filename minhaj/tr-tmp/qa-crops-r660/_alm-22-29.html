ذلك زاد معنى { حنفاء } بياناً بقوله { غير مشركين به } . وهذا كقوله : { إن إبراهيم كان أمة قانتاً لله حنيفاً ولم يك من المشركين } [ النحل : 120 ] .\r\nوالباء في قوله { مشركين به } للمصاحبة والمعية ، أي غير مشركين معه غيره .\r\n{ وَمَن يُشْرِكْ بالله فَكَأَنَّمَا خَرَّ مِنَ السمآء فَتَخْطَفُهُ الطير أَوْ تَهْوِى بِهِ الريح فِى مَكَانٍ سَحِيقٍ }\r\nأعقب نهيهم عن الأوثان بتمثيل فظاعة حال من يشرك بالله في مصيره بالشرك إلى حال انحطاط وتلقف الضلالات إياه ويأسه من النجاة ما دام مشركاً تمثيلاً بديعاً إذ كان من قبيل التمثيل القابل لتفريق أجزائه إلى تشبيهات .\r\nقال في « الكشاف » : « يجوز أن يكون هذا التشبيه من المركب والمفرّق بأن صُور حال المشرك بصورة حال مَن خرّ من السماء فاختطفَتْه الطيرُ فتفرّق مِزعاً في حواصلها ، أو عصفت به الريح حتى هوت به في بعض المطاوح البعيدة ، وإن كان مفرقاً فقد شبّه الإيمان في علوّه بالسماء ، والذي ترك الإيمان وأشرك بالله بالساقط من السماء ، والأهواء التي تتوزع أفكاره بالطير المختطفة ، والشيطان الذي يطوح به في وادي الضلالة بالريح التي تهوى بما عصفت به في بعض المهاوي المتلفة » أ ه .\r\nيعني أنّ المشرك لما عدل عن الإيمان الفطري وكان في مكنته فكأنه كان في السماء فسقط منها ، فتوزعته أنواع المهالك ، ولا يخفى عليك أنّ في مطاوي هذا التمثيل تشبيهات كثيرة لا يعوزك استخراجها .\r\nوالسحيق : البعيد فلا نجاة لمن حل فيه .\r\nوقوله : { أو تهوي به الريح } تخيير في نتيجة التشبيه ، كقوله : { أو كصيب من السماء } [ البقرة : 19 ] . أشارت الآية إلى أن الكافرين قسمان : قسم شِركه ذبذبة وشكّ ، فهذا مشبّه بمن اختطفته الطير فلا يستولي طائر على مزعة منه إلاّ انتهبها منه آخر ، فكذلك المذبذب متى لاح له خيال اتبعه وترك ما كان عليه . وقسم مصمّم على الكفر مستقر فيه ، فهو مشبّه بمن ألقته الريح في واد سحيق ، وهو إيماء إلى أن من المشركين من شركه لا يرجى منه خلاص كالذي تخطفته الطير ، ومنهم من شركه قد يخلص منه بالتوبة إلا أن توبته أمر بعيد عسير الحصول .\r\nوالخُرور : السقوط . وتقدم في قوله : { فخر عليهم السقف من فوقهم } في [ سورة النحل : 26 ] .\r\nو { تخطّفُه } مضاعف خطف للمبالغة ، الخطف والخطف : أخذ شيء بسرعة سواء كان في الأرض أم كان في الجو ومنه تخطف الكرة . والهُوِيّ : نزول شيء من علو إلى الأرض . والباء في { تهوي به } للتعدية مثلها في : ذهب به .\r\nوقرأ نافع ، وأبو جعفر { فتَخَطّفه } بفتح الخاء وتشديد الطاء مفتوحة مضارع خطّف المضاعف . وقرأه الجمهور بسكون الخاء وفتح الطاء مخففة مضارع خطف المجرّدf:[[\"$\",\"$L2a\",null,{\"title\":\"تفسير  (ابن عاشور) سورة الحج\",\"withDesc\":true,\"description\":\"حنفاء لله غير مشركين به ومن يشرك بالله فكأنما خر من السماء فتخطفه الطير أو تهوي به الريح في مكان سحيق\"}],[\"$\",\"main\",null,{\"className\":\"dark:[\u0026_h4]:text-white dark:[\u0026_h5]:text-white dark:[\u0026_h6]:text-white mt-10 mb-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"bg-white dark:bg-background font-primary rounded-xl shadow-sm text-sm max-h-[70svh] overflow-y-auto scrollbar px-4 py-2 bg-[url(\\\"/images/popup-bg.png\\\")] dark:bg-[url(\\\"/images/popup-bg-dark.svg\\\")] bg-no-repeat bg-bottom bg-cover\",\"children\":[\"$\",\"$L2b\",null,{\"data\":[{\"verse\":{\"verse_number\":\"29\",\"surah\":\"الحج\",\"surah_lt\":\"Al-Hajj\",\"surah_fr\":null,\"surah_en\":\"Al-Hajj\",\"chapter_number\":22,\"text\":\"حُنَفَآءَ لِلهِ غَيْرَ مُشْرۣكِينَ بِهِؐ” وَمَنْ يُّشْرۣكككْ بِاللَّهِ فَكَأَنَّـمَـا خَـرَّ مِــنَ ۰لسَّـمَـآءِ فَتَـخَـطَّفُـــــهُ ۴لطَّيْرُ أَوْ تَهْوۣى بِهِ ۱لرّۣيحُ فِى مَـكَـانٍ سَحِـيـقٍؐ \",\"arabic_text_chakl\":\"حنفاء لله غير مشركين به ومن يشرك بالله فكأنما خر من السماء فتخطفه الطير أو تهوي به الريح في مكان سحيق\",\"audio_text\":\"فَاجْتَنِـبُـواْ ۴لـرّۣجْـسَ مِـنَ ۰لاَوْثَـٰنِ وَاجْتَنِبُواْ قَوْلَ ۰لزُّورۣ  (28) حُنَفَآءَ لِلهِ غَيْرَ مُشْرۣكِينَ بِهِؐ” وَمَنْ يُّشْرۣكككْ بِاللَّهِ فَكَأَنَّـمَـا خَـرَّ مِــنَ ۰لسَّـمَـآءِ فَتَـخَـطَّفُـــــهُ ۴لطَّيْرُ أَوْ تَهْوۣى بِهِ ۱لرّۣيحُ فِى مَـكَـانٍ سَحِـيـقٍؐ  (29) \",\"word_start\":\"43185\",\"word_stop\":\"43212\"},\"tafsir\":{\"sources\":[{\"id\":\"11119\",\"title\":\"ابن عطية\",\"field_description\":\"$2c\",\"tooltips\":[{\"key\":null,\"value\":null}]},{\"id\":\"27730\",\"title\":\"القرطبي\",\"field_description\":\"السابعة- قوله تعالى :  \\\" حنفاء لله \\\"  معناه مستقيمين أو مسلمين مائلين إلى الحق .   ولفظة  \\\" حنفاء \\\"  من الأضداد تقع على الاستقامة وتقع على الميل .   و \\\" حنفاء \\\"  نصب على الحال .   وقيل :  \\\" حنفاء \\\"  حجاجا ،   وهذا تخصيص لا حجة معه .   الثامنة- \\\" ومن يشرك بالله فكأنما خر من السماء \\\"  أي هو يوم القيامة بمنزلة من لا يملك لنفسه نفعا ولا يدفع عن نفسه ضرا ولا عذابا ،   فهو بمنزلة من خر من السماء ،   فهو لا يقدر أن يدفع عن نفسه .   ومعنى  \\\" فتخطفه الطير \\\"  أي تقطعه بمخالبها .   وقيل : هذا عند خروج روحه وصعود الملائكة بها إلى سماء الدنيا ،   فلا يفتح لها فيرمى بها إلى الأرض ،   كما في حديث البراء ،   وقد ذكرناه في التذكرة .   والسحيق : البعيد ،   ومنه قوله تعالى :  \\\" فسحقا لأصحاب السعير \\\" {[11508]} [ الملك : 11 ] ،   وقوله عليه الصلاة والسلام : ( فسحقا فسحقا ) .\",\"tooltips\":[{\"key\":null,\"value\":null}]},{\"id\":\"17256\",\"title\":\"ابن عاشور\",\"field_description\":\"$2d\",\"tooltips\":[{\"key\":null,\"value\":null}]}]}}],\"selectedTafsir\":\"ابن عاشور\"}]}]}]]\n12:null\n18:[[\"$\",\"title\",\"0\",{\"children\":\"تفسير ابن عاشور سورة الحج الأية 29\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"تفسير ابن عاشور سورة الحج الأية 29 | تفسير قوله تعالى : حنفاء لله غير مشركين به ومن يشرك بالله فكأنما خر من السماء فتخطفه الطير أو تهوي به الريح في مكان سحيق\"}],[\"$\",\"meta\",\"2\",{\"name\":\"keywords\",\"content\":\"تفسير,سورة,سورة الحج,الأية 29,تفسير القرآن,حنفاء,لله,غير,مشركين,به,ومن,يشرك,بالله,فكأنما,خر,من,السماء,فتخطفه,الطير,أو,تهوي,به,الريح,في,مكان,سحيق\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:title\",\"content\":\"تفسير ابن عاشور سورة الحج الأية 29\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:description\",\"content\":\"تفسير ابن عاشور سورة الحج الأية 29 | تفسير قوله تعالى : حنفاء لله غير مشركين به ومن يشرك بالله فكأنما خر من السماء فتخطفه الطير أو تهوي به الريح في مكان سحيق\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"6\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"7\",{\"name\":\"
