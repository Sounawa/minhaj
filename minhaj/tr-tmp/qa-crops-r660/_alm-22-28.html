 جريج أن الآية نهي عن عبادة الأوثان ، و { الزور } ، عام في الكذب والكفر وذلك أن كل ما عدا الحق فهو كذب وباطل وزور ، وقال ابن مسعود ، وأيمن بن خريم وابن جريج : إن رسول الله صلى الله عليه وسلم قال : «عدلت شهادة الزور بالشرك » ، وتلا هذه الآية، و { الزور } مشتق من الزور وهو الميل ومنه في جانب فلان زور ويظهر أن الإشارة في زور أقوالهم في تحريم وتحليل مما كانوا قد شرعوه في الأنعام .\r\n\r\n2d:T144e,فيه ثمان مسائل :\r\nالأولى-قوله تعالى :  \" ذلك \"  يحتمل أن يكون في موضع رفع بتقدير : فرضكم ذلك ،   أو الواجب ذلك .   ويحتمل أن يكون في موضع نصب بتقدير : امتثلوا ذلك ،   ونحو هذه الإشارة البليغة قول زهير :\r\nهذا وليس كمن يَعْيَا بخُطَّتِهِ *** وَسْطَ النَّدِيّ إذا ما قائلٌ نَطَقَا\r\nوالحرمات المقصودة هنا هي أفعال الحج المشار إليها في قوله :  \" ثم ليقضوا تفثهم وليوفوا نذورهم \"  ويدخل في ذلك تعظيم المواضع ،   قاله ابن زيد وغيره .   ويجمع ذلك أن تقول : الحرمات امتثال الأمر من فرائضه وسننه .   وقوله :  \" فهو خير له عند ربه \"  أي التعظيم خير له عند ربه من التهاون بشيء منها .   وقيل : ذلك التعظيم خير من خيراته ينتفع به ،   وليست للتفضيل وإنما هي عدة بخير .  \r\nالثانية-قوله تعالى : \" وأحلت لكم الأنعام \"  أن تأكلوها ،   وهي الإبل والبقر والغنم .    \" إلا ما يتلى عليكم \"  أي في الكتاب من المحرمات ،   وهي الميتة والموقوذة وأخواتها .   ولهذا اتصال بأمر الحج ،   فإن في الحج الذبح ،   فبين ما يحل ذبحه وأكل لحمه .   وقيل :  \" إلا ما يتلى عليكم \"  غير محلي الصيد وأنتم حرم{[11504]} .  \r\nالثالثة- قوله تعالى :  \" فاجتنبوا الرجس من الأوثان{[11505]} \"  الرجس : الشيء القذر .   الوثن : التمثال من خشب أو حديد أو ذهب أو فضة ونحوها ،   وكانت العرب تنصبها وتعبدها .   والنصارى تنصب الصليب وتعبده وتعظمه فهو كالتمثال أيضا .   وقال عدي بن حاتم : أتيت النبي صلى الله عليه وسلم وفي عنقي صليب من ذهب فقال : ( ألق هذا الوثن عنك ) أي الصليب ،   وأصله من وثن الشيء أي أقام في مقامه .   وسمي الصنم وثنا لأنه ينصب ويركز في مكان فلا يبرح عنه .   يريد اجتنبوا عبادة الأوثان ،   روي عن ابن عباس وابن جريج .   وسماها رجسا لأنها سبب الرجز وهو العذاب .   وقيل : وصفها بالرجس ،   والرجس النجس فهي نجسة حكما .   وليست النجاسة وصفا ذاتيا للأعيان وإنما هي وصف شرعي من أحكام الإيمان ،   فلا تزال إلا بالإيمان كما لا تجوز الطهارة إلا بالماء .  \r\nالرابعة- \" من \"  في قوله :  \" من الأوثان \"  قيل : إنها لبيان الجنس ،   فيقع نهيه عن رجس{[11506]} الأوثان فقط ،   ويبقى سائر الأرجاس نهيها في غير هذا الموضع .   ويحتمل أن تكون لابتداء الغاية ،   فكأنه نهاهم عن الرجس عاما ثم عين لهم مبدأه الذي منه يلحقهم ؛ إذ عبادة الوثن جامعة لكل فساد ورجس .   ومن قال إن  \" من \"  للتبعيض ،   قلب معنى الآية وأفسده .  \r\nالخامسة- \" واجتنبوا قول الزور \"  والزور : الباطل والكذب .   وسمي زورا لأنه أميل عن الحق ،   ومنه  \" تزاور عن كهفهم \"  ،  {[11507]} [ الكهف : 17 ] ،   ومدينة زوراء ،   أي مائلة .   وكل ما عدا الحق فهو كذب وباطل وزور .   وفي الخبر أنه عليه السلام قام خطيبا فقال : ( عدلت شهادة الزور الشرك بالله ) قالها مرتين أو ثلاثا .   يعني أنها قد جمعت مع عبادة الوثن في النهي عنها .  \r\nالسادسة-هذه الآية تضمنت الوعيد على الشهادة بالزور ،   وينبغي للحاكم إذا عثر على الشاهد بالزور أن يعزره وينادي عليه ليعرف لئلا يغتر بشهادته أحد .   ويختلف الحكم في شهادته إذا تاب ،   فإن كان من أهل العدالة المشهور بها المبرز فيها لم تقبل ؛ لأنه لا سبيل إلى علم حاله في التوبة ؛ إذ لا يستطيع أن يفعل من القربات أكثر مما هو عليه .   وإن كان دون ذلك فشمر في العبادة وزادت حاله في التقى قبل شهادته .   وفي الصحيح عن النبي صلى الله عليه وسلم أنه قال : ( إن من أكبر الكبائر الإشراك بالله وعقوق الوالدين وشهادة الزور وقول الزور ) .   وكان رسول الله صلى الله عليه وسلم متكئا فجلس فما زال يكررها حتى قلنا ليته سكت .2e:T178e,{ ذلك وَمَن يُعَظِّمْ حرمات الله فَهُوَ خَيْرٌ لَّهُ عِندَ رَبِّهِ }\r\nاسم الإشارة مستعمل هنا للفصل بين كلامين أو بين وجهين من كلام واحد ، والقصد منه التنبيه على الاهتمام بما سيذكر بعده . فالإشارة مرادٌ بها التنبيه ، وذلك حيث يكون ما بعده غيرَ صالح لوقوعه خبراً عن اسم الإشارة فيتعين تقدير خبر عنه في معنى : ذلك بيانٌ ، أو ذكرٌ ، وهو من أساليب الاقتضاب في الانتقال . والمشهور في هذا الاستعمال لفظ ( هذا ) كما في قوله تعالى : { هذا وإن للطاغين لشر مئاب } [ ص : 55 ] وقولِ زهير :\r\nهَذا وليس كمن يَعْيَا بخطبته *** وسْط النّدي إذا ما قائل نَطقا\r\nوأوثر في الآية اسم إشارة البعيد للدلالة على بعد المنزلة كناية عن تعظيم مضمون ما قبله .\r\nفاسم الإشارة مبتدأ حذف خبره لظهور تقديره ، أي ذلك بيان ونحوه . وهو كما يقدم الكاتب جملة من كتابه في بعض الأغراض فإذا أراد الخوض في غرض آخر ، قال : هذا وقد كان كذا وكذا .\r\nوجملة { ومن يعظم } الخ . . . معترضة عطفاً على جملة { وإذا بوأنا لإبراهيم مكان البيت } [ الحج : 26 ] عطف الغرض على الغرض . وهو انتقال إلى بيان ما يجب الحفاظ عليه من الحنيفية والتنبيه إلى أن الإسلام بُنِي على أساسها .\r\nوضمير { فهو } عائد إلى التعظيم المأخوذ من فعل { ومن يعظم حرمات الله } . والكلام موجّه إلى المسلمين تنبيهاً لهم على أنّ تلك الحرمات لم يعطل الإسلام حرمتَها ، فيكون الانتقال من غرض إلى غرض ومن مخاطب إلى مخاطب آخر . فإن المسلمين كانوا يعتمرون ويحجون قبل إيجاب الحجّ عليهم ، أي قبل فتح مكة .\r\nوالحُرمات : جمع حُرُمة بضمتين : وهي ما يجب احترامه .\r\nوالاحترام : اعتبار الشيء ذَا حَرَم ، كناية عن عدم الدخول فيه . أي عدم انتهاكه بمخالفة أمر الله في شأنه ، والحُرمات يشمل كل ما أوصَى الله بتعظيم أمره فتشمل مناسك الحج كلها .\r\nوعن زيد بن أسلم : الحرمات خمس : المسجد الحرام ، والبيت الحرام ، والبلد الحرام ، والشهر الحرام ، والمُحرم ما دام محرماً ، فقصَرَه على الذوات دون الأعمال . والذي يظهر أن الحرمات يشمل الهدايا والقلائد والمشعر الحرام وغير ذلك من أعمال الحجّ ، كالغسل في مواقعه ، والحلق ومواقيته ومناسكه .\r\n{ وَأُحِلَّتْ لَكُمُ الانعام إِلاَّ مَا يتلى عَلَيْكُمْ فاجتنبوا الرجس مِنَ الاوثان واجتنبوا قَوْلَ الزور }\r\nلما ذكر آنفاً بهيمة الأنعام وتعظيم حرمات الله أعقب ذلك بإبطال ما حرمه المشركون على أنفسهم من الأنعام مثل : البَحيرة ، والسائبة ، والوصيلة ، والحَامي وبعضضِ ما في بطونها . وقد ذكر في سورة الأنعام .\r\nواستثني منه ما يتلى تحريمه في القرآن وهو ما جاء ذكره في [ سورة الأنعام : 145 ] في قوله : { قل لا أجد فيما أوحي إلي محرماً } الآيات وما ذكر في سورة النحل وكلتاهما مكيتان سابقتان .\r\nوجيء بالمضارع في قوله : { إلا ما يتلى عليكم } ليشمل ما نزل من القرآن في ذلك مما سبق نزولَ سورة الحجّ بأنه تلي فيما مضى ولم يزل يتلى ، ويشمل ما عسى أن يَنزل من بعد مثل قوله : { ما جعل الله من بحيرة ولا سائبة } الآية في [ سورة العقود : 103 ] .\r\nوالأمر باجتناب الأوثان مستعمل في طلب الدوام كما في قوله : { يأيها الذين آمنوا آمنوا بالله ورسوله } [ النساء : 136 ] . وفرع على ذلك جملة معترضة للتصريح بالأمر باجتناب ما ليس من حرمات الله ، وهو الأوثان .\r\nواجتناب الكذب على الله بقولهم لبعض المحرمات { هذا حلال } مثل الدم وما أهلّ لغير الله به ، وقولهم لبعض : هذا حرام مثل البَحيرة ، والسائبة . قال تعالى : { ولا تقولوا لما تصف ألسنتكم الكذب هذا حلال وهذا حرام لتفتروا على الله الكذب } [ النحل : 116 ] .\r\nوالرّجس : حقيقته الخبث والقذارة ، وتقدم في قوله تعالى : { فإنه رجس } في [ سورة الأنعام : 145 ] .\r\nووصف الأوثان بالرجس أنها رجس معنوي لِكون اعتقاد إلهيتها في النفوس بمنزلة تعلّق الخبث بالأجساد فإطلاق الرجس عليها تشبيه بليغ .\r\nو ( مِن ) في قوله من الأوثان بيان لمجمل الرجس ، فهي تدخل على بعض أسماء التمييز بياناً للمراد من الرجس هنا لا أن معنى ذلك أن الرجس هو عين الأوثان بل الرجس أعمّ أريد به هنا بعض أنواعه فهذا تحقيق معنى ( من ) البيانية .f:[[\"$\",\"$L2a\",null,{\"title\":\"تفسير  (ابن عاشور) سورة الحج\",\"withDesc\":true,\"description\":\"ذلك ومن يعظم حرمات الله فهو خير له عند ربه وأحلت لكم الأنعام إلا ما يتلى عليكم فاجتنبوا الرجس من الأوثان واجتنبوا قول الزور\"}],[\"$\",\"main\",null,{\"className\":\"dark:[\u0026_h4]:text-white dark:[\u0026_h5]:text-white dark:[\u0026_h6]:text-white mt-10 mb-8\",\"children\":[\"$\",\"div\",null,{\"className\":\"bg-white dark:bg-background font-primary rounded-xl shadow-sm text-sm max-h-[70svh] overflow-y-auto scrollbar px-4 py-2 bg-[url(\\\"/images/popup-bg.png\\\")] dark:bg-[url(\\\"/images/popup-bg-dark.svg\\\")] bg-no-repeat bg-bottom bg-cover\",\"children\":[\"$\",\"$L2b\",null,{\"data\":[{\"verse\":{\"verse_number\":\"28\",\"surah\":\"الحج\",\"surah_lt\":\"Al-Hajj\",\"surah_fr\":null,\"surah_en\":\"Al-Hajj\",\"chapter_number\":22,\"text\":\"ذَ؛لِـكَؐ وَمَـنْ يُّعَظِّمْ حُرُمَـٰــتِ ۱للَّهِ فَهُوَ خَيْرٌ لَّهُ„ عِـنـدَ رَبِّـهِؐ” وَٱُحِـلَّـتْ لَكُمُ ۴لاَنْعَـٰمُ إِلاَّ مَا يُتْلۭــيٰ عَلَيْكُمْؐ فَاجْتَنِـبُـواْ ۴
